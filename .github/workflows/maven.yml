name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Checkstyle
        run: mvn checkstyle:check

  build-and-push:
    needs: checkstyle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Maven project
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t dashasync/messenger-app:latest .

      - name: Push Docker image
        run: docker push dashasync/messenger-app:latest

  notify:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger infra workflow
        run: |
          curl -X POST https://api.github.com/repos/dasha-sync/messenger-infra/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.INFRA_TOKEN }}" \
            -d '{"event_type":"update-submodules"}'
